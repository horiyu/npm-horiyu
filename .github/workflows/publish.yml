name: Publish to npm

# Stages a release via npm trusted publishing (OIDC) with provenance.
# The Trusted Publisher on npmjs.com is stage-only, so the version stays
# uninstallable until a maintainer approves it with 2FA on npmjs.com
# (or `npm stage approve <stage-id>`).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # `npm stage` requires npm >= 11.15.0 (Node 24.22 bundles 11.19).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm stage publish --provenance --access public --ignore-scripts
