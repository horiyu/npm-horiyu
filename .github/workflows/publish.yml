name: Publish to npm

# Publishes via npm trusted publishing (OIDC) with provenance.
# Configure the Trusted Publisher on npmjs.com for this repository and
# workflow file (publish.yml) before creating a release.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Trusted publishing requires npm >= 11.5.1 (bundled with Node 24).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm publish --provenance --access public --ignore-scripts
